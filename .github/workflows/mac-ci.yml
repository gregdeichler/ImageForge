name: macOS CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "docs/**", "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: imageforge-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: [self-hosted, macOS, ARM64, imageforge]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Host diagnostics
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test -v

      - name: Build release app
        if: github.event_name != 'pull_request'
        env:
          IMAGEFORGE_BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/package-macos.sh

      - name: Upload downloadable app
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ImageForge-macOS-arm64
          path: dist/ImageForge-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 14
